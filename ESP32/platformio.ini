; PBC-gAPI — Copyright Pablo B. C. ESP32-WROOM-32, no PSRAM.
[platformio]
default_envs = lovyan-ili9341
src_dir = PBC_gAPI_ESP32/examples/CheckerCubeSphere

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://PBC_gAPI_ESP32
build_flags = -include PBC_gAPI_ESP32/examples/CheckerCubeSphere/DisplayConfig.h

[lovyan]
lib_deps =
    ${env.lib_deps}
    https://github.com/lovyan03/LovyanGFX.git#1.2.7

[espi]
lib_deps =
    ${env.lib_deps}
    https://github.com/Bodmer/TFT_eSPI.git#v2.5.33
build_flags = ${env.build_flags} -DPBC_USE_TFT_ESPI=1

[env:lovyan-ili9341]
lib_deps = ${lovyan.lib_deps}

[env:espi-ili9341]
lib_deps = ${espi.lib_deps}
build_flags = ${espi.build_flags}

[env:lovyan-parallel-ili9341]
lib_deps = ${lovyan.lib_deps}
build_flags = ${env.build_flags} -DPBC_DISPLAY_PROFILE=2 -DPBC_TOUCH_XPT2046=0

[env:espi-parallel-ili9341]
lib_deps = ${espi.lib_deps}
build_flags = ${espi.build_flags} -DPBC_DISPLAY_PROFILE=2 -DPBC_TOUCH_XPT2046=0

[env:lovyan-st7789]
lib_deps = ${lovyan.lib_deps}
build_flags = ${env.build_flags} -DPBC_DISPLAY_PROFILE=3 -DPBC_TOUCH_XPT2046=0

[env:espi-st7789]
lib_deps = ${espi.lib_deps}
build_flags = ${espi.build_flags} -DPBC_DISPLAY_PROFILE=3 -DPBC_TOUCH_XPT2046=0

[env:lovyan-ili9488]
lib_deps = ${lovyan.lib_deps}
build_flags = ${env.build_flags} -DPBC_DISPLAY_PROFILE=5 -DPBC_TOUCH_XPT2046=0

[env:espi-ili9488]
lib_deps = ${espi.lib_deps}
build_flags = ${espi.build_flags} -DPBC_DISPLAY_PROFILE=5 -DPBC_TOUCH_XPT2046=0

[env:lovyan-parallel-touch]
lib_deps = ${lovyan.lib_deps}
build_flags = ${env.build_flags} -DPBC_DISPLAY_PROFILE=2 -DPBC_TOUCH_XPT2046=0 -DPBC_TOUCH_4WIRE=1

[env:espi-parallel-touch]
lib_deps = ${espi.lib_deps}
build_flags = ${espi.build_flags} -DPBC_DISPLAY_PROFILE=2 -DPBC_TOUCH_XPT2046=0 -DPBC_TOUCH_4WIRE=1

[env:lovyan-ili9341-half]
lib_deps = ${lovyan.lib_deps}
build_flags = ${env.build_flags} -DPBC_RENDER_SCALE=2

[env:espi-ili9341-half]
lib_deps = ${espi.lib_deps}
build_flags = ${espi.build_flags} -DPBC_RENDER_SCALE=2
